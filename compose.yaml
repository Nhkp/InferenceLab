services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: inferencelab-cpu:dev
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  mock:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: inferencelab-cpu:dev
    command: ["uvicorn", "inference_lab.benchmark.mock_server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
