name: CPU checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.9"
          enable-cache: true
      - run: make install
      - run: make lint typecheck test
      - run: make build
      - run: SERVING_RUN_ID=ci-config docker compose -f compose.gpu.yaml --profile gpu config --quiet
      - run: docker build -f deploy/docker/Dockerfile -t inferencelab-cpu:ci .
